name: Docs

# Keeps the in-app /docs data in sync with the source of truth.
# If lib/field-registry.ts or lib/openapi-spec.ts change, app/docs/_data must be
# regenerated (npm run generate:docs) and committed. Mirrors the existing
# "TYPES.md freshness check" in ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "lib/field-registry.ts"
      - "lib/openapi-spec.ts"
      - "scripts/generate-docs.ts"
      - "app/docs/_data/**"
  pull_request:
    branches: [main]
    paths:
      - "lib/field-registry.ts"
      - "lib/openapi-spec.ts"
      - "scripts/generate-docs.ts"
      - "app/docs/_data/**"

jobs:
  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so generate:docs can read per-file commit dates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Regenerate docs data
        run: npm run generate:docs

      - name: Verify docs are in sync
        run: |
          git diff --exit-code app/docs/_data \
            || (echo "::error::app/docs/_data is stale — run 'npm run generate:docs' and commit." && exit 1)
