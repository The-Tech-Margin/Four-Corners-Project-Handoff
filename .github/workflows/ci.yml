name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Fast-feedback suites — fail the job early without waiting for the full
      # coverage run. Each line mirrors a focused script in package.json so
      # contributors can reproduce a single failing suite locally.
      - name: Schema drift
        run: npm run test:schema
      - name: Canvas suite
        run: npm run test:canvas
      - name: User assets (library) suite
        run: npm run test:user-assets
      - name: Upload limits suite
        run: npm run test:upload-limits

      - name: Run all tests with coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: TYPES.md freshness check
        run: |
          npm run generate:types
          git diff --exit-code TYPES.md || (echo "TYPES.md is stale — run 'npm run generate:types' and commit" && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"

  # Applies any unrun SQL files in supabase/migrations/ to the production
  # Supabase project. Gated on tests only — NOT lint/build: the chronically
  # red lint job silently skipped every migrate run until 2026-07-10, which
  # is how prod drifted (see supabase/baseline/README.md). History was
  # baselined 2026-07-10, so db push executes only files newer than the
  # recorded history — never a blind replay.
  #
  # Requires the SUPABASE_DB_URL secret: the direct (non-pooling) Postgres
  # connection string. The previous link-based flow needed three secrets and
  # an auth path that was never exercised.
  #
  # NOTE: migration filenames must be pure-digit "<timestamp>_name.sql" —
  # the CLI silently skips anything else (both 20260502a/b_*.sql files were
  # applied by hand and are invisible to db push).
  migrate:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
