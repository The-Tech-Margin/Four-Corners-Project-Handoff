name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test -- --coverage

  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # generate:docs reads per-file commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: JSON Schema is current
        run: |
          npm run generate:schema
          git diff --exit-code schema \
            || (echo "::error::schema/ is stale — run 'npm run generate:schema' and commit." && exit 1)

      # generatedAt follows commit dates, which move whenever history is
      # rewritten (squash, rebase, cherry-pick) — so only content counts.
      - name: In-app docs data is current
        run: |
          npm run generate:docs
          git diff --exit-code -I '"generatedAt":' app/docs/_data \
            || (echo "::error::app/docs/_data is stale — run 'npm run generate:docs' and commit." && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Builds with the defaults in .env.example: no service credentials.
      - run: npm ci
      - run: npm run build
